name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    # Placeholder public values so `next build` can compile without GitHub secrets.
    # Runtime Supabase access is not exercised in this pipeline.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Generate Next.js types
        run: npx next typegen

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
